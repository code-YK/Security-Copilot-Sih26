<svg xmlns="http://www.w3.org/2000/svg" width="3200" height="1800" viewBox="0 0 3200 1800" role="img" aria-labelledby="title desc">
  <title id="title">Red Eye — SIH 26127 City-Wide Multi-Camera ANPR Technical Approach</title>
  <desc id="desc">A proposed system architecture showing camera feeds flowing through plate recognition, confidence-aware cross-camera trajectory fusion, city traffic analytics, and an operator GIS dashboard. A proposed technology stack and privacy safeguards are shown below.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F5F8FC"/><stop offset="1" stop-color="#EDF3F9"/></linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#142842"/><stop offset="1" stop-color="#203E61"/></linearGradient>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#31B5D0"/><stop offset=".53" stop-color="#5278E8"/><stop offset="1" stop-color="#FF9E54"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#18334F" flood-opacity=".09"/></filter>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#172B43}
      .muted{fill:#65758A}.white{fill:#fff}.caps{font-weight:750;letter-spacing:2px}.smallcaps{font-weight:750;letter-spacing:1.4px}
      .body{font-size:22px}.micro{font-size:18px}.pill{font-size:19px;font-weight:650}
      .card{fill:#fff;stroke:#DFE7EF;stroke-width:2}.stage{font-size:23px;font-weight:800;letter-spacing:1.5px}
      .item{font-size:24px;font-weight:700}.desc{font-size:20px;fill:#65758A}
    </style>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto"><path d="M1 1L11 7 1 13" fill="none" stroke="#91A5BA" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="3200" height="1800" fill="url(#bg)"/>
  <path d="M0 0H3200V14H0Z" fill="#19A9C8"/>
  <!-- Header -->
  <text x="110" y="104" class="smallcaps" font-size="22" fill="#178FAE">SMART INDIA HACKATHON · SOFTWARE · SMART AUTOMATION</text>
  <text x="110" y="188" font-size="58" font-weight="820">CITY-WIDE ANPR,</text>
  <text x="110" y="254" font-size="58" font-weight="820" fill="#2879AE">CONNECTED JOURNEYS.</text>
  <text x="112" y="302" font-size="23" class="muted">From scattered plate reads to one city-scale picture of movement.</text>
  <rect x="2360" y="72" width="730" height="188" rx="28" fill="url(#navy)"/>
  <text x="2400" y="119" class="smallcaps white" font-size="19" opacity=".72">PROBLEM STATEMENT</text>
  <text x="2400" y="169" class="white" font-size="31" font-weight="760">26127 · Bharat Electronics Limited</text>
  <path d="M2400 188H3050" stroke="#FFFFFF" opacity=".18"/>
  <text x="2400" y="229" class="white" font-size="22" font-weight="650">TEAM 142647  /  RED EYE</text>
  <text x="110" y="383" class="caps" font-size="20" fill="#60748B">THE SYSTEM FLOW</text>
  <text x="3065" y="383" text-anchor="end" class="smallcaps" font-size="19" fill="#73859A">PROPOSED TECHNICAL APPROACH</text>

  <!-- Stage cards -->
  <g filter="url(#shadow)">
    <rect x="100" y="420" width="555" height="670" rx="28" class="card"/>
    <rect x="715" y="420" width="555" height="670" rx="28" class="card"/>
    <rect x="1330" y="420" width="555" height="670" rx="28" class="card"/>
    <rect x="1945" y="420" width="555" height="670" rx="28" class="card"/>
    <rect x="2560" y="420" width="555" height="670" rx="28" class="card"/>
  </g>
  <!-- connectors -->
  <path d="M660 752H703" stroke="#91A5BA" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1275 752H1318" stroke="#91A5BA" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1890 752H1933" stroke="#91A5BA" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M2505 752H2548" stroke="#91A5BA" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- 1 Connect -->
  <circle cx="151" cy="478" r="25" fill="#1BA6C5"/><text x="151" y="487" text-anchor="middle" class="white" font-size="22" font-weight="800">01</text>
  <text x="193" y="486" class="stage" fill="#167F9C">CONNECT</text>
  <text x="140" y="548" class="item">Distributed cameras</text>
  <text x="140" y="584" class="desc">Existing city CCTV / ANPR nodes</text>
  <!-- camera glyph -->
  <rect x="140" y="630" width="474" height="158" rx="21" fill="#E9F6FA"/>
  <path d="M176 684h60l28-22v76l-28-22h-60z" fill="none" stroke="#168EAD" stroke-width="7" stroke-linejoin="round"/>
  <path d="M282 665q34 35 0 70M299 650q51 50 0 100" fill="none" stroke="#35AEC8" stroke-width="5" stroke-linecap="round"/>
  <circle cx="201" cy="702" r="6" fill="#168EAD"/>
  <text x="355" y="681" font-size="22" font-weight="750">LIVE VIDEO</text>
  <text x="355" y="716" class="desc">RTSP / ONVIF</text>
  <text x="355" y="750" class="micro muted">camera ID · time · location</text>
  <text x="140" y="838" class="item">Edge ingest &amp; buffering</text>
  <text x="140" y="873" class="desc">Normalize streams; sample frames</text>
  <text x="140" y="900" class="desc">Keep processing near the source.</text>
  <rect x="140" y="963" width="229" height="42" rx="21" fill="#E6F5F8"/><text x="254" y="991" text-anchor="middle" class="pill" fill="#167F9C">timestamp sync</text>
  <rect x="380" y="963" width="224" height="42" rx="21" fill="#E6F5F8"/><text x="492" y="991" text-anchor="middle" class="pill" fill="#167F9C">camera registry</text>

  <!-- 2 Read -->
  <circle cx="766" cy="478" r="25" fill="#7559D9"/><text x="766" y="487" text-anchor="middle" class="white" font-size="22" font-weight="800">02</text>
  <text x="808" y="486" class="stage" fill="#624BC0">READ THE PLATE</text>
  <text x="755" y="548" class="item">Detect → enhance → OCR</text>
  <text x="755" y="584" class="desc">Built for real road conditions</text>
  <rect x="755" y="630" width="474" height="158" rx="21" fill="#F0EDFC"/>
  <rect x="789" y="662" width="177" height="93" rx="12" fill="#fff" stroke="#D9D0F6" stroke-width="2"/>
  <text x="877" y="697" text-anchor="middle" font-size="18" class="smallcaps" fill="#8071C6">PLATE READ</text>
  <text x="877" y="737" text-anchor="middle" font-size="32" font-weight="800" letter-spacing="2">KA 03</text>
  <path d="M995 709h56" stroke="#9C8FE0" stroke-width="4" marker-end="url(#arrow)"/>
  <circle cx="1101" cy="709" r="39" fill="#fff" stroke="#D9D0F6" stroke-width="2"/>
  <text x="1101" y="704" text-anchor="middle" font-size="18" class="muted">CONF.</text>
  <text x="1101" y="730" text-anchor="middle" font-size="23" font-weight="800" fill="#624BC0">0.94</text>
  <text x="755" y="838" class="item">Confidence-aware event</text>
  <text x="755" y="873" class="desc">Multi-frame consensus; plate format</text>
  <text x="755" y="900" class="desc">normalization; low-confidence review.</text>
  <rect x="755" y="963" width="212" height="42" rx="21" fill="#F0EDFC"/><text x="861" y="991" text-anchor="middle" class="pill" fill="#624BC0">plate crop</text>
  <rect x="978" y="963" width="251" height="42" rx="21" fill="#F0EDFC"/><text x="1103" y="991" text-anchor="middle" class="pill" fill="#624BC0">text + confidence</text>
  <text x="992" y="1050" text-anchor="middle" font-size="18" font-weight="700" fill="#624BC0">TARGET: &gt;90% OCR · validate in adverse conditions</text>

  <!-- 3 Link / unique center network -->
  <circle cx="1381" cy="478" r="25" fill="#3478DB"/><text x="1381" y="487" text-anchor="middle" class="white" font-size="22" font-weight="800">03</text>
  <text x="1423" y="486" class="stage" fill="#2F69BE">LINK THE JOURNEY</text>
  <text x="1370" y="548" class="item">One vehicle · many cameras</text>
  <text x="1370" y="584" class="desc">Confidence + time + road topology</text>
  <rect x="1370" y="630" width="474" height="158" rx="21" fill="#EAF1FC"/>
  <!-- network map -->
  <path d="M1411 750C1460 720 1448 666 1517 675S1582 755 1640 724 1694 653 1764 683" fill="none" stroke="#CCD8EC" stroke-width="18" stroke-linecap="round"/>
  <path d="M1411 750C1460 720 1448 666 1517 675S1582 755 1640 724 1694 653 1764 683" fill="none" stroke="url(#route)" stroke-width="6" stroke-linecap="round" stroke-dasharray="12 9"/>
  <g fill="#fff" stroke="#3478DB" stroke-width="5"><circle cx="1411" cy="750" r="13"/><circle cx="1517" cy="675" r="13"/><circle cx="1640" cy="724" r="13"/><circle cx="1764" cy="683" r="13"/></g>
  <g fill="#3478DB"><circle cx="1411" cy="750" r="4"/><circle cx="1517" cy="675" r="4"/><circle cx="1640" cy="724" r="4"/><circle cx="1764" cy="683" r="4"/></g>
  <text x="1370" y="838" class="item">Spatiotemporal fusion</text>
  <text x="1370" y="873" class="desc">Normalize plate reads; match partial</text>
  <text x="1370" y="900" class="desc">reads; order by feasible travel time.</text>
  <rect x="1370" y="963" width="230" height="42" rx="21" fill="#EAF1FC"/><text x="1485" y="991" text-anchor="middle" class="pill" fill="#2F69BE">route graph</text>
  <rect x="1611" y="963" width="233" height="42" rx="21" fill="#EAF1FC"/><text x="1728" y="991" text-anchor="middle" class="pill" fill="#2F69BE">queryable timeline</text>

  <!-- 4 Analyze -->
  <circle cx="1996" cy="478" r="25" fill="#E48A37"/><text x="1996" y="487" text-anchor="middle" class="white" font-size="22" font-weight="800">04</text>
  <text x="2038" y="486" class="stage" fill="#B66721">ANALYZE THE CITY</text>
  <text x="1985" y="548" class="item">Aggregate movement</text>
  <text x="1985" y="584" class="desc">Turn event streams into useful signals</text>
  <rect x="1985" y="630" width="474" height="158" rx="21" fill="#FFF3E8"/>
  <g transform="translate(2021 653)">
    <path d="M0 106h392M0 73h392M0 40h392M45 0v106M112 0v106M179 0v106M246 0v106M313 0v106" stroke="#E8DACC" stroke-width="2"/>
    <path d="M45 87l67-26 67 10 67-46 67 25 79-38" fill="none" stroke="#E48A37" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#fff" stroke="#E48A37" stroke-width="4"><circle cx="45" cy="87" r="6"/><circle cx="112" cy="61" r="6"/><circle cx="179" cy="71" r="6"/><circle cx="246" cy="25" r="6"/><circle cx="313" cy="50" r="6"/><circle cx="392" cy="12" r="6"/></g>
  </g>
  <text x="1985" y="838" class="item">Density · OD · bottlenecks</text>
  <text x="1985" y="873" class="desc">Time-windowed counts, route loads,</text>
  <text x="1985" y="900" class="desc">travel-time trends and live heatmaps.</text>
  <rect x="1985" y="963" width="211" height="42" rx="21" fill="#FFF3E8"/><text x="2090" y="991" text-anchor="middle" class="pill" fill="#B66721">zone / time</text>
  <rect x="2207" y="963" width="252" height="42" rx="21" fill="#FFF3E8"/><text x="2333" y="991" text-anchor="middle" class="pill" fill="#B66721">citywide indicators</text>

  <!-- 5 Deliver -->
  <circle cx="2611" cy="478" r="25" fill="#209879"/><text x="2611" y="487" text-anchor="middle" class="white" font-size="22" font-weight="800">05</text>
  <text x="2653" y="486" class="stage" fill="#17765F">ACT &amp; EXPLORE</text>
  <text x="2600" y="548" class="item">A control-room view</text>
  <text x="2600" y="584" class="desc">GIS map, timelines, traffic signals</text>
  <rect x="2600" y="630" width="474" height="158" rx="21" fill="#E7F6F0"/>
  <rect x="2633" y="650" width="408" height="118" rx="13" fill="#fff" stroke="#CEE9DD" stroke-width="2"/>
  <path d="M2653 730l50-44 46 18 56-35 42 28 68-21 77 37" fill="none" stroke="#B8D5CC" stroke-width="10" stroke-linecap="round"/>
  <path d="M2653 730l50-44 46 18 56-35 42 28 68-21 77 37" fill="none" stroke="#209879" stroke-width="4" stroke-linecap="round" stroke-dasharray="7 8"/>
  <g fill="#fff" stroke="#209879" stroke-width="4"><circle cx="2653" cy="730" r="9"/><circle cx="2750" cy="704" r="9"/><circle cx="2847" cy="697" r="9"/><circle cx="2947" cy="693" r="9"/><circle cx="3038" cy="731" r="9"/></g>
  <text x="2600" y="838" class="item">Search · alert · understand</text>
  <text x="2600" y="873" class="desc">Authorized plate journey lookup;</text>
  <text x="2600" y="900" class="desc">watchlist and unusual-route alerts.</text>
  <rect x="2600" y="963" width="212" height="42" rx="21" fill="#E7F6F0"/><text x="2706" y="991" text-anchor="middle" class="pill" fill="#17765F">GIS playback</text>
  <rect x="2823" y="963" width="251" height="42" rx="21" fill="#E7F6F0"/><text x="2948" y="991" text-anchor="middle" class="pill" fill="#17765F">audited alerts</text>

  <!-- Event spine -->
  <rect x="100" y="1123" width="3015" height="83" rx="24" fill="url(#navy)"/>
  <text x="148" y="1175" class="white" font-size="21" font-weight="800" letter-spacing="1.3">CITY EVENT SPINE</text>
  <text x="507" y="1175" class="white" font-size="23" opacity=".93">Camera frame</text>
  <path d="M690 1164h70" stroke="#67C9D9" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="791" y="1175" class="white" font-size="23" opacity=".93">Plate read + confidence</text>
  <path d="M1065 1164h70" stroke="#67C9D9" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1164" y="1175" class="white" font-size="23" opacity=".93">Linked camera events</text>
  <path d="M1472 1164h70" stroke="#67C9D9" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1571" y="1175" class="white" font-size="23" opacity=".93">Route + traffic metrics</text>
  <path d="M1968 1164h70" stroke="#67C9D9" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="2067" y="1175" class="white" font-size="23" opacity=".93">GIS + operator action</text>
  <text x="3065" y="1175" text-anchor="end" class="white" font-size="18" opacity=".64">time · camera · confidence · location</text>

  <!-- Stack -->
  <text x="110" y="1280" class="caps" font-size="20" fill="#60748B">PROPOSED TECHNOLOGY STACK</text>
  <text x="3060" y="1280" text-anchor="end" font-size="18" class="muted">Modular components · edge-to-city deployment</text>
  <g>
    <rect x="100" y="1310" width="720" height="208" rx="24" fill="#fff" stroke="#DCE5EF" stroke-width="2"/>
    <rect x="840" y="1310" width="720" height="208" rx="24" fill="#fff" stroke="#DCE5EF" stroke-width="2"/>
    <rect x="1580" y="1310" width="720" height="208" rx="24" fill="#fff" stroke="#DCE5EF" stroke-width="2"/>
    <rect x="2320" y="1310" width="795" height="208" rx="24" fill="#fff" stroke="#DCE5EF" stroke-width="2"/>
  </g>
  <circle cx="142" cy="1354" r="8" fill="#1BA6C5"/><text x="164" y="1362" class="smallcaps" font-size="20" fill="#167F9C">VISION &amp; OCR</text>
  <text x="140" y="1414" class="body" font-weight="650">Python · PyTorch · YOLOv8</text>
  <text x="140" y="1453" class="body" font-weight="650">PaddleOCR · OpenCV</text>
  <text x="140" y="1490" class="micro muted">Detection · enhancement · recognition</text>

  <circle cx="882" cy="1354" r="8" fill="#7559D9"/><text x="904" y="1362" class="smallcaps" font-size="20" fill="#624BC0">STREAMING &amp; SERVICES</text>
  <text x="880" y="1414" class="body" font-weight="650">FastAPI · Kafka · Redis</text>
  <text x="880" y="1453" class="body" font-weight="650">Docker · WebSocket / REST</text>
  <text x="880" y="1490" class="micro muted">Ingest · event routing · live updates</text>

  <circle cx="1622" cy="1354" r="8" fill="#3478DB"/><text x="1644" y="1362" class="smallcaps" font-size="20" fill="#2F69BE">DATA &amp; TRAJECTORY</text>
  <text x="1620" y="1414" class="body" font-weight="650">PostgreSQL · PostGIS</text>
  <text x="1620" y="1453" class="body" font-weight="650">Time-series partitions · Redis</text>
  <text x="1620" y="1490" class="micro muted">Spatial queries · camera / route graph</text>

  <circle cx="2362" cy="1354" r="8" fill="#209879"/><text x="2384" y="1362" class="smallcaps" font-size="20" fill="#17765F">GIS DASHBOARD &amp; OPERATIONS</text>
  <text x="2360" y="1414" class="body" font-weight="650">Next.js · React · MapLibre GL</text>
  <text x="2360" y="1453" class="body" font-weight="650">Role-based access · audit logs</text>
  <text x="2360" y="1490" class="micro muted">Journey search · heatmaps · alert review</text>

  <!-- Safeguards footer -->
  <rect x="100" y="1554" width="3015" height="111" rx="24" fill="#E4ECF4"/>
  <path d="M146 1593l23-10 23 10v22c0 18-15 30-23 34-8-4-23-16-23-34z" fill="none" stroke="#385A7B" stroke-width="4" stroke-linejoin="round"/>
  <path d="M160 1614l7 7 13-16" fill="none" stroke="#209879" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="216" y="1606" font-size="21" font-weight="800">SAFE BY DESIGN</text>
  <text x="216" y="1639" font-size="18" class="muted">Every sensitive lookup leaves an audit trail.</text>
  <path d="M595 1578v64" stroke="#C6D2DF" stroke-width="2"/>
  <text x="638" y="1612" font-size="20" font-weight="650">Purpose-bound access</text>
  <text x="638" y="1642" class="micro muted">Role-based permissions</text>
  <text x="1122" y="1612" font-size="20" font-weight="650">Protected identifiers</text>
  <text x="1122" y="1642" class="micro muted">Encryption · minimize exposure</text>
  <text x="1700" y="1612" font-size="20" font-weight="650">Retention controls</text>
  <text x="1700" y="1642" class="micro muted">Configurable policy · expiry</text>
  <text x="2248" y="1612" font-size="20" font-weight="650">Traceable decisions</text>
  <text x="2248" y="1642" class="micro muted">Evidence · confidence · audit</text>
  <text x="3090" y="1730" text-anchor="end" font-size="16" class="muted">Architecture proposal for SIH PS 26127 · Stack represents a suggested implementation.</text>
</svg>
