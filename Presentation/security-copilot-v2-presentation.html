<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Security-Copilot v2 — SIH26106</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<style>
:root{
  --bg:#080D16; --panel:#0F1622; --panel2:#16202F; --raised:#1C2839;
  --border:rgba(128,150,185,.13); --border-strong:rgba(128,150,185,.28);
  --text:#E8EDF5; --muted:#828FA6; --dim:#525C72;
  --cyan:#4EC6D2; --cyan-dim:rgba(78,198,210,.12);
  --amber:#E0A244; --amber-dim:rgba(224,162,68,.13);
  --red:#E85D62; --red-dim:rgba(232,93,98,.13);
  --green:#3EC48D; --green-dim:rgba(62,196,141,.13);
  --radius:10px;
  --disp:'Space Grotesk',sans-serif; --body:'Inter',sans-serif; --mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{background:var(--bg); color:var(--text); font-family:var(--body); overflow:hidden; position:relative;}
@media (prefers-reduced-motion:reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }

.bg-grid{
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background-image:
    radial-gradient(ellipse 900px 500px at 15% -10%, rgba(78,198,210,.06), transparent 60%),
    radial-gradient(ellipse 700px 500px at 100% 100%, rgba(61,147,160,.05), transparent 60%),
    linear-gradient(var(--border) 1px, transparent 1px),
    linear-gradient(90deg, var(--border) 1px, transparent 1px);
  background-size:100% 100%,100% 100%,64px 64px,64px 64px; opacity:.5;
}

/* trace strip */
.trace-strip{position:fixed; top:0; left:0; right:0; height:34px; z-index:50; display:flex; align-items:center; gap:10px; padding:0 18px;
  background:linear-gradient(180deg, rgba(8,13,22,.96), rgba(8,13,22,.85)); border-bottom:1px solid var(--border); backdrop-filter:blur(6px);
  font-family:var(--mono); font-size:11px; color:var(--dim); letter-spacing:.04em;}
.trace-strip .dot{width:6px; height:6px; border-radius:50%; background:var(--green); box-shadow:0 0 8px var(--green); flex-shrink:0;}
.trace-strip.alert .dot{background:var(--red); box-shadow:0 0 8px var(--red);}
.trace-strip canvas{flex:1; height:18px; max-width:340px;}
.trace-strip .label{color:var(--muted); white-space:nowrap;}
.trace-strip .spacer{flex:1;}

/* rail + nav */
.rail{position:fixed; left:22px; top:50%; transform:translateY(-50%); z-index:40; display:flex; flex-direction:column; gap:9px;}
.rail button{all:unset; cursor:pointer; width:9px; height:9px; border-radius:50%; background:var(--dim); transition:all .25s; position:relative;}
.rail button:hover{background:var(--muted);}
.rail button.active{background:var(--cyan); box-shadow:0 0 0 3px var(--cyan-dim); height:22px; border-radius:5px;}
.rail button .tip{position:absolute; left:20px; top:50%; transform:translateY(-50%); font-family:var(--mono); font-size:10.5px; color:var(--muted); white-space:nowrap;
  opacity:0; transition:opacity .15s; pointer-events:none; background:var(--panel2); padding:3px 8px; border-radius:5px; border:1px solid var(--border);}
.rail button:hover .tip{opacity:1;}
.navctl{position:fixed; right:26px; bottom:26px; z-index:40; display:flex; gap:8px; align-items:center;}
.navctl button{all:unset; cursor:pointer; width:42px; height:42px; border-radius:50%; background:var(--panel2); border:1px solid var(--border);
  display:flex; align-items:center; justify-content:center; color:var(--text); transition:all .2s;}
.navctl button:hover{background:var(--raised); border-color:var(--border-strong);}
.navctl button:disabled{opacity:.3; cursor:default;}
.navctl .count{font-family:var(--mono); font-size:11px; color:var(--muted); padding:0 10px; min-width:52px; text-align:center;}
.navctl .fs{width:36px; height:36px;}
.footer-hint{position:fixed; bottom:26px; left:90px; font-family:var(--mono); font-size:10.5px; color:var(--dim); z-index:5;}

/* screens */
.deck{position:fixed; inset:0; z-index:1;}
.screen{position:absolute; inset:0; padding:78px 90px 60px 90px; display:flex; flex-direction:column; justify-content:center;
  opacity:0; pointer-events:none; transform:translateX(24px); transition:opacity .38s ease, transform .38s ease; overflow-y:auto;}
.screen.active{opacity:1; pointer-events:auto; transform:translateX(0);}
.screen.leaving{transform:translateX(-24px);}
.screen.tall{justify-content:flex-start;}
.eyebrow{font-family:var(--mono); font-size:12px; color:var(--cyan); letter-spacing:.14em; text-transform:uppercase; display:flex; align-items:center; gap:10px; margin-bottom:14px;}
.eyebrow::before{content:''; width:22px; height:1px; background:var(--cyan);}
h1.title{font-family:var(--disp); font-weight:700; font-size:clamp(30px,4vw,54px); line-height:1.05; letter-spacing:-.01em; margin-bottom:14px;}
h1.title.s{font-size:clamp(24px,2.6vw,34px);}
h2.sub{font-family:var(--body); font-weight:400; font-size:clamp(14px,1.3vw,18px); color:var(--muted); max-width:820px; line-height:1.55;}
.section-num{position:absolute; top:78px; right:90px; font-family:var(--mono); font-size:12px; color:var(--dim);}

/* components */
.grid{display:grid; gap:16px;}
.g4{grid-template-columns:repeat(4,1fr);} .g3{grid-template-columns:repeat(3,1fr);} .g2{grid-template-columns:repeat(2,1fr);}
.g6{grid-template-columns:repeat(3,1fr);}
.card{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:20px;}
.card:hover{border-color:var(--border-strong);}
.kpi{padding:22px 20px;}
.kpi .val{font-family:var(--disp); font-size:clamp(26px,2.6vw,38px); font-weight:700; color:var(--cyan);}
.kpi .lbl{font-family:var(--mono); font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin-top:6px;}
.kpi .src{font-size:10.5px; color:var(--dim); margin-top:10px;}
.pill{display:inline-flex; align-items:center; gap:6px; font-family:var(--mono); font-size:10.5px; padding:3px 9px; border-radius:20px; border:1px solid var(--border); color:var(--muted);}
.pill.live{color:var(--green); border-color:rgba(62,196,141,.35); background:var(--green-dim);}
.pill.demo{color:var(--amber); border-color:rgba(224,162,68,.35); background:var(--amber-dim);}
.pill.bad{color:var(--red); border-color:rgba(232,93,98,.35); background:var(--red-dim);}
.chip-row{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px;}
.two-col{display:grid; grid-template-columns:1.1fr .9fr; gap:22px; align-items:start;}
.detail-box{margin-top:16px; background:var(--panel2); border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px; font-size:13.5px; line-height:1.6; min-height:70px;}
.detail-box .k{font-family:var(--mono); font-size:10px; color:var(--cyan); text-transform:uppercase; letter-spacing:.06em; display:block; margin-bottom:5px;}
.scroll-note, .mm-caption{font-size:11px; color:var(--dim); font-family:var(--mono); margin-top:8px;}
.chartwrap{position:relative; height:220px;}
ul.plain{padding-left:18px; font-size:13px; line-height:1.9;}
code, .mono{font-family:var(--mono); font-size:.92em;}

/* incident cards */
.incident{padding:18px; display:flex; flex-direction:column; gap:8px;}
.incident .amt{font-family:var(--disp); font-size:26px; font-weight:700; color:var(--red);}
.incident .row{display:flex; gap:8px; font-size:12px;}
.incident .row .k{color:var(--dim); width:56px; flex-shrink:0; font-family:var(--mono); font-size:10.5px; text-transform:uppercase; padding-top:2px;}
.incident .row .v{line-height:1.5;}

/* attack flow */
.aflow{display:flex; align-items:stretch; margin-top:26px;}
.aflow .anode{flex:1 1 0; min-width:0; background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:14px 13px; cursor:pointer; transition:all .2s; display:flex; flex-direction:column; gap:7px; min-height:132px;}
.aflow .anode:hover, .aflow .anode.on{border-color:var(--cyan); background:var(--panel2); box-shadow:0 0 0 1px var(--cyan-dim);}
.aflow .anode .an{font-family:var(--mono); font-size:10px; color:var(--dim);}
.aflow .anode .at{font-family:var(--disp); font-weight:600; font-size:13px; line-height:1.28;}
.aflow .anode .atag{margin-top:auto; align-self:flex-start; font-family:var(--mono); font-size:8.5px; letter-spacing:.04em; text-transform:uppercase; color:var(--cyan); border:1px solid rgba(78,198,210,.35); background:var(--cyan-dim); border-radius:20px; padding:3px 7px;}
.aflow .aconn{flex:0 0 30px; align-self:center; position:relative; height:24px;}
.aflow .aconn::before{content:''; position:absolute; left:3px; right:9px; top:50%; height:2px; background:var(--cyan); opacity:.55;}
.aflow .aconn::after{content:''; position:absolute; right:4px; top:50%; transform:translateY(-50%); border-left:8px solid var(--cyan); border-top:5px solid transparent; border-bottom:5px solid transparent;}

/* mermaid stage + modal */
.seg{display:inline-flex; gap:6px; background:var(--panel); border:1px solid var(--border); border-radius:9px; padding:4px; flex-wrap:wrap;}
.seg button{all:unset; cursor:pointer; padding:8px 16px; border-radius:6px; font-size:12.5px; font-family:var(--mono); color:var(--muted);}
.seg button.on{background:var(--cyan-dim); color:var(--cyan);}
.mm-stage{margin-top:14px; background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:18px; overflow:hidden; height:46vh; min-height:300px; display:flex; align-items:center; justify-content:center;}
.mm-wrap{width:100%; height:100%; display:flex; align-items:center; justify-content:center;}
.mm-wrap.hidden{display:none;}
.mm-wrap .mermaid{width:100%; height:100%; display:flex; align-items:center; justify-content:center;}
.mm-wrap svg{width:auto !important; max-width:100% !important; height:auto !important; max-height:100% !important;}
.mm-stage .edgeLabel, .mm-stage .edgeLabel *{font-family:var(--mono) !important; fill:var(--muted) !important; color:var(--muted) !important;}
.mm-barline{display:flex; align-items:center; gap:14px; margin-top:10px;}
.mm-barline .mm-caption{margin-top:0; flex:1;}
.mm-expand{all:unset; cursor:pointer; font-weight:600; font-size:12.5px; padding:9px 16px; border-radius:8px; background:var(--cyan-dim); color:var(--cyan); border:1px solid rgba(78,198,210,.4); white-space:nowrap;}
.mm-expand:hover{background:rgba(78,198,210,.2);}
.modal{position:fixed; inset:0; z-index:200; display:none; align-items:center; justify-content:center; background:rgba(4,8,14,.82); backdrop-filter:blur(5px);}
.modal.open{display:flex;}
.modal-inner{width:93vw; height:90vh; background:var(--panel); border:1px solid var(--border-strong); border-radius:14px; display:flex; flex-direction:column; overflow:hidden;}
.modal-head{display:flex; align-items:center; gap:12px; padding:12px 16px; border-bottom:1px solid var(--border);}
.modal-head .mt{font-family:var(--disp); font-weight:600; font-size:14.5px;}
.modal-head .spacer{flex:1;}
.modal-ctrls{display:flex; gap:6px;}
.modal-ctrls button{all:unset; cursor:pointer; min-width:34px; height:34px; padding:0 10px; border-radius:8px; background:var(--panel2); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-size:13px;}
.modal-ctrls .zpct{min-width:56px; color:var(--muted); pointer-events:none;}
.modal-ctrls .mclose{background:var(--red-dim); border-color:rgba(232,93,98,.4); color:var(--red);}
.modal-stage{flex:1; overflow:hidden; position:relative; cursor:grab;
  background-image:linear-gradient(rgba(128,150,185,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(128,150,185,.06) 1px, transparent 1px); background-size:40px 40px;}
.modal-stage.grabbing{cursor:grabbing;}
.modal-canvas{position:absolute; top:50%; left:50%; transform-origin:center center;}
.modal-canvas svg{width:auto !important; height:auto !important; max-width:none !important; max-height:none !important;}
.modal-hint{position:absolute; left:14px; bottom:12px; font-family:var(--mono); font-size:10.5px; color:var(--dim);}

/* coverage matrix */
.pscomp{padding:16px; display:flex; flex-direction:column; gap:8px;}
.pscomp .n{font-family:var(--mono); font-size:10px; color:var(--dim);}
.pscomp .t{font-family:var(--disp); font-weight:600; font-size:15px;}
.pscomp .m{font-family:var(--mono); font-size:11px; color:var(--cyan); line-height:1.6;}
.pscomp .d{font-size:12px; color:var(--muted); line-height:1.5;}
.ok{color:var(--green); font-family:var(--mono); font-size:11px;}

/* header trace */
.hops{display:flex; flex-direction:column; gap:0; margin-top:6px;}
.hop{display:grid; grid-template-columns:34px 1fr auto; gap:12px; align-items:center; padding:12px 14px; background:var(--panel); border:1px solid var(--border); border-radius:9px; cursor:pointer; transition:all .18s;}
.hop:hover, .hop.on{border-color:var(--cyan); background:var(--panel2);}
.hop .i{font-family:var(--mono); font-size:11px; color:var(--dim);}
.hop .h{font-size:13px;} .hop .h .ip{font-family:var(--mono); color:var(--cyan);}
.hop .ts{font-family:var(--mono); font-size:10.5px; color:var(--dim); margin-top:3px;}
.hopline{height:14px; margin-left:30px; border-left:2px dashed var(--border-strong);}
.email-raw{font-family:var(--mono); font-size:11px; line-height:1.65; color:var(--muted); white-space:pre-wrap; background:var(--panel); border:1px solid var(--border); border-radius:9px; padding:14px; max-height:46vh; overflow:auto;}
.email-raw .hl{color:var(--amber);} .email-raw .bad{color:var(--red);}

/* auth + calculator */
.authgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px;}
.authcard{padding:16px;}
.authcard .t{font-family:var(--disp); font-weight:700; font-size:20px;}
.authcard .q{font-size:12px; color:var(--muted); margin-top:4px; line-height:1.5;}
.authcard .how{font-family:var(--mono); font-size:10.5px; color:var(--dim); margin-top:10px;}
.res{font-family:var(--mono); font-size:11px; padding:3px 9px; border-radius:20px; display:inline-block; margin-top:10px;}
.res.pass{color:var(--green); background:var(--green-dim);} .res.fail{color:var(--red); background:var(--red-dim);} .res.none{color:var(--muted); background:var(--panel2);}
.calc{display:grid; grid-template-columns:1fr 1fr; gap:10px 16px;}
.calc label{font-family:var(--mono); font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; display:flex; flex-direction:column; gap:5px;}
.calc select{all:unset; text-transform:none; font-family:var(--mono); font-size:12px; padding:7px 10px; border-radius:7px; background:var(--panel2); border:1px solid var(--border); color:var(--text); cursor:pointer;}
.calc .tog{flex-direction:row; align-items:center; gap:8px; text-transform:none; font-family:var(--body); font-size:12.5px; color:var(--text); letter-spacing:0; cursor:pointer;}
.calc input[type=checkbox]{accent-color:var(--cyan); width:15px; height:15px;}
.calc input[type=range]{accent-color:var(--cyan);}
.verdict-out .lab{font-family:var(--disp); font-weight:700; font-size:30px; text-transform:capitalize;}
.riskbar{height:9px; border-radius:6px; background:var(--panel2); margin-top:10px; overflow:hidden;}
.riskbar span{display:block; height:100%; border-radius:6px; transition:width .3s, background .3s;}
.factors{margin-top:12px; font-size:12px; line-height:1.7; color:var(--muted); padding-left:16px;}
.attr{margin-top:12px; font-size:12.5px; line-height:1.55;}
.attr b{color:var(--amber); font-family:var(--mono); font-weight:500;}

/* taxonomy */
.tax{padding:14px; border-left:3px solid var(--border-strong);}
.tax .t{font-family:var(--disp); font-weight:600; font-size:15px;}
.tax .d{font-size:12px; color:var(--muted); margin-top:5px; line-height:1.5;}

/* geo */
#geoMap{height:340px; border-radius:9px; border:1px solid var(--border); background:#0b1320;}
.kv{display:grid; grid-template-columns:120px 1fr; gap:6px 12px; font-size:12.5px;}
.kv .k{font-family:var(--mono); font-size:10.5px; color:var(--dim); text-transform:uppercase; padding-top:2px;}
.src-row{display:flex; justify-content:space-between; gap:10px; padding:8px 0; border-bottom:1px solid var(--border); font-size:12px;}
.src-row:last-child{border-bottom:0;}
.src-row .m{font-family:var(--mono); font-size:10.5px; color:var(--dim); text-align:right;}

/* attachment */
.fileviz{display:flex; gap:10px; align-items:center; flex-wrap:wrap; font-family:var(--mono); font-size:13px;}
.fileviz .part{padding:10px 14px; border-radius:8px; border:1px solid var(--border); background:var(--panel2);}
.fileviz .part.fake{color:var(--muted);} .fileviz .part.real{color:var(--red); border-color:rgba(232,93,98,.45); background:var(--red-dim);}
.check-row{display:grid; grid-template-columns:24px 1fr auto; gap:10px; padding:10px 0; border-bottom:1px solid var(--border); font-size:12.5px; align-items:start;}
.check-row:last-child{border-bottom:0;}

/* screenshots */
.shot{border-radius:9px; border:1px solid var(--border); display:block; width:100%;}
.shot-scroll{max-height:52vh; overflow:auto; border-radius:9px; border:1px solid var(--border);}
.shot-scroll img{width:100%; display:block;}

table.cmp{width:100%; border-collapse:collapse; font-size:12.5px;}
table.cmp th{text-align:left; font-family:var(--mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); padding:9px 12px; border-bottom:1px solid var(--border-strong);}
table.cmp td{padding:9px 12px; border-bottom:1px solid var(--border); vertical-align:top;}
table.cmp td.m{font-family:var(--mono); font-size:11.5px; color:var(--cyan);}

.flow{display:flex; align-items:stretch; flex-wrap:wrap;}
.flow .node{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px; min-width:130px;}
.flow .node .n{font-family:var(--mono); font-size:10px; color:var(--dim);}
.flow .node .t{font-family:var(--disp); font-weight:600; font-size:14.5px; margin-top:4px;}
.flow .arrow{display:flex; align-items:center; justify-content:center; width:34px; color:var(--dim);}
::-webkit-scrollbar{width:8px;} ::-webkit-scrollbar-thumb{background:var(--panel2); border-radius:4px;}
.leaflet-container{font-family:var(--body);}
/* OSM tiles darkened to match the deck */
.dark-tiles{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9) saturate(.6);}

@media (max-width:980px){
  .screen{padding:70px 26px 90px 26px;}
  .g4,.g3,.g6{grid-template-columns:repeat(2,1fr);}
  .g2,.two-col,.authgrid,.calc{grid-template-columns:1fr;}
  .rail{display:none;}
  .aflow{flex-direction:column;} .aflow .anode{min-height:auto;}
  .aflow .aconn{width:100%; transform:rotate(90deg); margin:2px 0;}
}
</style>
</head>
<body>

<div class="bg-grid"></div>
<div class="trace-strip" id="traceStrip">
  <span class="dot"></span>
  <span class="label" id="traceLabel">MAIL FORENSICS — nominal</span>
  <canvas id="traceCanvas" width="340" height="18"></canvas>
  <span class="spacer"></span>
  <span class="label" id="clockLabel">security-copilot v2 // SIH26106</span>
</div>
<div class="rail" id="rail"></div>
<div class="navctl">
  <button id="prevBtn" title="Previous (←)">‹</button>
  <span class="count" id="countLabel">01</span>
  <button id="nextBtn" title="Next (→)">›</button>
  <button class="fs" id="fsBtn" title="Fullscreen (F)">⛶</button>
</div>
<div class="footer-hint">← → to navigate · F fullscreen</div>
<div class="deck" id="deck"></div>

<div class="modal" id="archModal">
  <div class="modal-inner">
    <div class="modal-head">
      <span class="mt" id="archModalTitle">Architecture</span>
      <span class="spacer"></span>
      <div class="modal-ctrls">
        <button id="mzOut">−</button><button class="zpct" id="mzPct">100%</button><button id="mzIn">+</button>
        <button id="mzReset">Reset</button><button class="mclose" id="mzClose">✕</button>
      </div>
    </div>
    <div class="modal-stage" id="archModalStage">
      <div class="modal-canvas" id="archModalCanvas"></div>
      <div class="modal-hint">Drag to pan · scroll to zoom · Esc to close</div>
    </div>
  </div>
</div>

<script>
const SECTIONS = [
  {id:'opening', label:'Opening'},
  {id:'problem', label:'The Problem'},
  {id:'incidents', label:'Real-World Incidents'},
  {id:'ps', label:'Problem Statement'},
  {id:'attack', label:'Anatomy of a Spoofed Email'},
  {id:'architecture', label:'Architecture'},
  {id:'headers', label:'Header Forensics'},
  {id:'auth', label:'SPF · DKIM · DMARC'},
  {id:'geo', label:'Origin Traceability'},
  {id:'attach', label:'Attachment Analysis'},

let current = 0;
const pad = n => String(n).padStart(2,'0');

const rail = document.getElementById('rail');
SECTIONS.forEach((s,i)=>{
  const b = document.createElement('button');
  b.innerHTML = `<span class="tip">${pad(i+1)} — ${s.label}</span>`;
  b.addEventListener('click', ()=>goTo(i));
  rail.appendChild(b);
});
function updateRail(){
  [...rail.children].forEach((b,i)=>b.classList.toggle('active', i===current));
  document.getElementById('countLabel').textContent = `${pad(current+1)} / ${SECTIONS.length}`;
  document.getElementById('prevBtn').disabled = current===0;
  document.getElementById('nextBtn').disabled = current===SECTIONS.length-1;
}
const onEnter = {};
function goTo(i){
  if(i<0 || i>=SECTIONS.length || i===current) return;
  const screens = document.querySelectorAll('.screen');
  screens[current].classList.remove('active'); screens[current].classList.add('leaving');
  screens[i].classList.remove('leaving');
  requestAnimationFrame(()=> screens[i].classList.add('active'));
  const prev = current; setTimeout(()=> screens[prev].classList.remove('leaving'), 400);
  current = i; updateRail();
  const id = SECTIONS[i].id;
  document.getElementById('traceStrip').classList.toggle('alert', ['attack','headers','auth','attach'].includes(id));
  document.getElementById('traceLabel').textContent =
    ['attack','headers','auth','attach'].includes(id) ? 'MAIL FORENSICS — spoofed message under analysis' : 'MAIL FORENSICS — nominal';
  if(onEnter[id]) onEnter[id]();
}
document.getElementById('prevBtn').addEventListener('click', ()=>goTo(current-1));
document.getElementById('nextBtn').addEventListener('click', ()=>goTo(current+1));
document.addEventListener('keydown', e=>{
  if(document.getElementById('archModal').classList.contains('open')){ if(e.key==='Escape') closeArchModal(); return; }
  if(['INPUT','SELECT'].includes(document.activeElement.tagName)) return;
  if(e.key==='ArrowRight' || e.key===' '){ e.preventDefault(); goTo(current+1); }
  if(e.key==='ArrowLeft') goTo(current-1);
  if(e.key.toLowerCase()==='f') toggleFullscreen();
});
document.getElementById('fsBtn').addEventListener('click', toggleFullscreen);
function toggleFullscreen(){ if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{}); else document.exitFullscreen(); }

const tctx = document.getElementById('traceCanvas').getContext('2d');
let traceData = Array.from({length:60}, ()=> 3+Math.random()*4);
(function drawTrace(){
  const alert = document.getElementById('traceStrip').classList.contains('alert');
  traceData.shift(); traceData.push(alert ? 2+Math.random()*14 : 3+Math.random()*4);
  tctx.clearRect(0,0,340,18); tctx.beginPath();
  traceData.forEach((v,i)=>{ const x=i*(340/59), y=18-v; i===0 ? tctx.moveTo(x,y) : tctx.lineTo(x,y); });
  tctx.strokeStyle = alert ? '#E85D62' : '#4EC6D2'; tctx.lineWidth = 1.4; tctx.stroke();
  requestAnimationFrame(drawTrace);
})();

const deck = document.getElementById('deck');
function screenWrap(i, html, cls=''){
  const el = document.createElement('section');
  el.className = 'screen' + (i===0 ? ' active' : '') + (cls ? ' '+cls : '');
  el.dataset.id = SECTIONS[i].id;
  el.innerHTML = `<div class="section-num">${pad(i+1)} / ${SECTIONS.length}</div>` + html;
  deck.appendChild(el);
}

/* ---- Verdict calculator — same rules as backend/agent/verdict_rules.py ---- */
const BASE = {'legitimate':.05,'suspicious':.45,'impersonated':.7,'phishing':.85,'fraud-related':.9};
const ATTR = {compromised_account:'Compromised account', spoofed_domain:'Spoofed domain', anonymized_infrastructure:'Anonymized infrastructure', direct_actor:'Direct actor', unknown:'Unknown'};
const $ = id => document.getElementById(id);
function computeVerdict(){
  const v = {label:$('cLabel').value, spf:$('cSpf').value, dkim:$('cDkim').value, dmarc:$('cDmarc').value,
    tor:$('cTor').checked, vpn:$('cVpn').checked, exe:$('cExe').checked, macro:$('cMacro').checked,
    reply:$('cReply').checked, order:$('cOrder').checked, age:+$('cAge').value};
  $('cAgeV').textContent = v.age + ' d';
  let bump = 0, hard = false; const f = [];
  if(v.dmarc==='fail'){ bump+=.30; hard=true; f.push('DMARC failed for the From: domain (+0.30)'); }
  if(v.spf==='fail'){ bump+=.20; hard=true; f.push('SPF hard-fail (+0.20)'); }
  else if(v.spf==='softfail'){ bump+=.10; f.push('SPF softfail (+0.10)'); }
  if(v.dkim==='fail'){ bump+=.15; f.push('DKIM signature failed (+0.15)'); }
  if(v.tor){ bump+=.15; f.push('Originated from a TOR exit node (+0.15)'); }
  else if(v.vpn){ bump+=.10; f.push('Originated from a VPN range (+0.10)'); }
  if(v.exe){ bump+=.25; f.push('Attachment is a disguised executable (+0.25)'); }
  if(v.macro){ bump+=.20; f.push('Office attachment contains macros (+0.20)'); }
  if(v.reply){ bump+=.05; f.push('Reply-To on another domain (+0.05)'); }
  if(v.order){ bump+=.05; f.push('Out-of-order Received hops (+0.05)'); }
  let label = v.label;
  if(hard && label==='legitimate'){ label='suspicious'; f.push('Escalated from legitimate: sender authentication failed'); }
  if(label==='suspicious' && v.dmarc==='fail'){ label='impersonated'; f.push('Escalated to impersonated: From: domain did not authenticate'); }
  const risk = Math.min(1, Math.max(BASE[v.label] + bump, BASE[label]));
  // attribution (alignment assumed for a passing SPF, misaligned for a failing one)
  const anon = v.tor || v.vpn;
  const authed = v.dmarc==='pass' || v.spf==='pass' || v.dkim==='pass';
  let a, why;
  if(label==='legitimate'){ a='unknown'; why='No malicious activity to attribute.'; }
  else if(v.dmarc==='fail' || v.spf==='fail'){ a='spoofed_domain'; why='Fails the claimed domain\'s SPF/DMARC — the sender forged an address they don\'t control.'; }
  else if(authed && v.age>=180){ a='compromised_account'; why=`Genuinely authenticated by an established domain (${v.age} days), yet malicious — most likely a compromised mailbox.`; }
  else if(authed && anon){ a='anonymized_infrastructure'; why='Authenticates for the domain but was sent through TOR/VPN to hide its origin.'; }
  else if(authed){ a='direct_actor'; why=`The attacker appears to own the domain (${v.age} days old) and sent from their own infrastructure.`; }
  else if(anon){ a='anonymized_infrastructure'; why='Sent through TOR/VPN infrastructure to hide its origin.'; }
  else { a='unknown'; why='Authentication is inconclusive — not enough evidence to attribute.'; }
  $('oLabel').textContent = label;
  $('oLabel').style.color = label==='legitimate' ? 'var(--green)' : label==='suspicious' ? 'var(--amber)' : 'var(--red)';
  $('oRisk').textContent = Math.round(risk*100) + ' / 100';
  $('oBar').style.width = (risk*100)+'%';
  $('oBar').style.background = risk<.3 ? 'var(--green)' : risk<.6 ? 'var(--amber)' : 'var(--red)';
  $('oFactors').innerHTML = f.length ? f.map(x=>`<li>${x}</li>`).join('') : '<li>No forensic risk factors</li>';
  $('oAttr').innerHTML = `Attribution: <b>${ATTR[a]}</b><br><span style="color:var(--muted);">${why}</span>`;
}
document.querySelectorAll('#calc select, #calc input').forEach(el=> el.addEventListener('input', computeVerdict));
computeVerdict();
